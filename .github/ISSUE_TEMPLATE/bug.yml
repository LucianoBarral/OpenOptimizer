name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versão do Open Optimizer
      description: Configurações → Sobre → Versão
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir…
        2. Clicar em…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (opcional)
      description: Conteúdo de %ProgramData%\OpenOptimizer\logs, se existir.
      render: text

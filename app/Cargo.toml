[package]
name = "open-optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
oo-views = { path = "../crates/oo-views" }
# Mesmas versões que o wry/Tauri usa por baixo (evita duas cópias do binding).
webview2-com = "0.39"
windows = "0.62"
oo-core = { path = "../crates/oo-core" }
oo-sys = { path = "../crates/oo-sys" }
oo-catalog = { path = "../crates/oo-catalog" }
oo-metrics = { path = "../crates/oo-metrics" }
